<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design World — Explore New Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--pad-x:clamp(20px,6.95vw,120px);--ac:#4d7cff;--card:#0c0c0f;--hi:#1c1d23;--lo:#000;--mu:#8a92a3}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{background:#000;color:#fff;font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
.hero{position:relative;width:100%;height:100vh;height:100svh;min-height:520px;overflow:hidden;background:#000}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
#scene.dragging{cursor:grabbing}
.ui{position:absolute;inset:0;pointer-events:none;z-index:2}
.ui a,.ui button{pointer-events:auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nav{position:absolute;top:clamp(24px,4.7vh,40px);left:var(--pad-x);right:var(--pad-x);display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:15px;letter-spacing:-.01em}
.logo-mark{width:20px;height:40px;background:#fff;border-radius:0 20px 20px 0}
.logo b{font-weight:700}.logo span{font-weight:400}
.nav-links{display:flex;gap:clamp(20px,4.1vw,60px);list-style:none}
.nav-links a{color:#fff;text-decoration:none;font-size:15px;font-weight:500;position:relative}
.nav-links a::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .35s ease}
.nav-links a:hover::after{transform:scaleX(1);transform-origin:left}
.arrows{position:absolute;top:18.9%;left:76.7%;display:flex;gap:32px;transform:translate(-19px,-50%)}
.arrow{width:38px;height:38px;border-radius:50%;border:2.5px solid #fff;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .25s,color .25s}
.arrow svg{width:18px;height:18px}
.arrow:hover{background:#fff;color:#000}
.dots{position:absolute;right:calc(var(--pad-x) - 7px);top:49.4%;transform:translateY(-50%);display:flex;flex-direction:column;gap:33px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:#fff;cursor:pointer;transition:background .25s}
.dot.active{background:transparent}
.tagline{position:absolute;left:var(--pad-x);bottom:clamp(40px,7.5vh,70px);font-size:clamp(24px,2.65vw,44px);line-height:1.2;font-weight:300;letter-spacing:-.01em}
.tagline strong{font-weight:700;display:block}
.cta-row{position:absolute;left:45.6%;right:-1vw;top:88.7%;transform:translateY(-50%);display:flex;align-items:center}
.cta{flex:none;padding:0 15px;height:48px;display:inline-flex;align-items:center;border:1.5px solid rgba(255,255,255,.85);border-radius:6px;background:rgba(0,0,0,.15);color:#fff;font-size:14px;font-weight:400;text-decoration:none;cursor:pointer;transition:background .25s,color .25s}
.cta:hover{background:#fff;color:#000}
.cta-line{flex:1;height:1.5px;background:rgba(255,255,255,.8);min-width:40px}
.count{flex:none;font-size:clamp(140px,19.8vw,360px);font-weight:400;line-height:1;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9);transform:translateY(6%);user-select:none}
.loader{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;transition:opacity .6s}
.loader.done{opacity:0}
.fb{display:none;position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;font-size:clamp(48px,11vw,150px);font-weight:800;line-height:1.05;color:#e9e9e9}
.no3d .fb{display:block}.no3d .loader{display:none}
@media (max-width:900px),(max-aspect-ratio:1/1){
 .arrows{left:auto;right:var(--pad-x);top:15%;transform:translateY(-50%);gap:14px}
 .tagline{bottom:clamp(150px,20vh,220px)}
 .cta-row{left:var(--pad-x);right:-3vw;top:auto;bottom:24px;transform:none}
 .count{font-size:clamp(120px,22vw,200px)}
}
@media (max-width:640px){
 .nav-links{gap:16px}.nav-links a,.logo{font-size:13px}
 .dots{gap:20px;right:16px}.dot{width:10px;height:10px}
 .cta-row{right:-8vw}.count{font-size:120px}
}
@media (max-width:420px){.nav-links li:nth-child(2){display:none}}
/* lower sections */
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--pad-x)}
.lower{background:#000;padding:110px 0 20px}
.eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:14px}
.eyebrow::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:12px}
h2{font-size:clamp(36px,5.2vw,76px);font-weight:300;line-height:1.1;letter-spacing:-.02em;margin-bottom:46px}h2 b{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px;margin-bottom:120px}
.stat b{display:block;font-size:clamp(54px,7vw,100px);font-weight:400;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9)}
.stat small{display:block;margin-top:10px;font-size:15px;color:rgba(255,255,255,.7)}
section.blk{margin-bottom:120px}
.svc{display:grid;grid-template-columns:150px 1fr 1.3fr;gap:30px;padding:38px 0;border-top:1.5px solid rgba(255,255,255,.8)}
.svc:last-child{border-bottom:1.5px solid rgba(255,255,255,.8)}
.num{font-size:84px;line-height:1;font-weight:400;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9)}
.st h3{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:6px 0}
.st .ic{font-size:26px}.st .from{font-weight:300;font-size:16px;color:rgba(255,255,255,.7)}
.pr{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.18);font-size:16px}
.pr:last-child{border-bottom:0}.pr b{font-weight:600}
.work{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px;}
.slot{border:1.5px solid rgba(255,255,255,.35);border-radius:6px;overflow:hidden;cursor:zoom-in;color:rgba(255,255,255,.55);font-size:14px}
.slot{aspect-ratio:4/5;background:#0b0b0b}
.slot img{display:block;width:100%;height:100%;object-fit:contain}
.slot.bad img{display:none}.slot.bad::after{content:"Photo could not load";display:block;padding:60px 16px;text-align:center}
#zoom{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#zoom.on{display:flex}#zoom img{max-width:92vw;max-height:92vh;border-radius:6px}
.chat-b{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:50;height:48px;padding:0 20px;border:1.5px solid rgba(255,255,255,.85);border-radius:6px;background:#000;color:#fff;font:400 14px 'Poppins',sans-serif;cursor:pointer;transition:background .25s,color .25s}
.chat-b:hover{background:#fff;color:#000}
.chat-p{position:fixed;right:20px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:50;width:min(340px,calc(100vw - 40px));height:min(440px,62vh);background:#000;border:1.5px solid rgba(255,255,255,.85);border-radius:6px;display:none;flex-direction:column}
.chat-p.open{display:flex}
.chat-h{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.25);font-weight:600;font-size:15px}
.chat-m{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.cm{max-width:85%;padding:8px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.3);word-break:break-word}
.cm.me{align-self:flex-end;background:#fff;color:#000}
.chat-f{display:flex;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.25)}
.chat-f input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font:400 14px 'Poppins',sans-serif;padding:13px 14px}
.chat-f #cn{flex:1 1 100%;border-bottom:1px solid rgba(255,255,255,.2)}
.chat-f button{background:#fff;color:#000;border:0;padding:0 18px;font:600 14px 'Poppins',sans-serif;cursor:pointer}
.sub{font-weight:300;font-size:18px;color:rgba(255,255,255,.7);margin:-20px 0 34px;max-width:520px}
.btns{display:flex;gap:16px;flex-wrap:wrap}
.cta.fill{background:#fff;color:#000}.cta.fill:hover{background:transparent;color:#fff}
.blk .cta{height:54px;padding:0 26px;font-size:15px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1.5px solid rgba(255,255,255,.25);padding:26px 0 40px;font-size:13px;color:rgba(255,255,255,.6)}
.logo .lm{display:flex}
@media(max-width:760px){.svc{grid-template-columns:1fr;gap:14px}.num{font-size:60px}}

/* neumorphism */
:root{--nb:#0d0d10;--nhi:#1e1f26;--nlo:#000}
.lower{background:linear-gradient(#000,var(--nb) 180px)}
.stat{padding:26px 22px;border-radius:28px;background:var(--nb);box-shadow:10px 10px 22px var(--nlo),-10px -10px 22px var(--nhi)}
.svc{border:0;border-radius:32px;padding:34px;margin-bottom:30px;background:var(--nb);box-shadow:12px 12px 26px var(--nlo),-12px -12px 26px var(--nhi)}
.svc:last-child{border:0}
.pr{border:0;border-radius:16px;padding:13px 18px;margin-top:10px;background:var(--nb);box-shadow:inset 6px 6px 12px var(--nlo),inset -6px -6px 12px var(--nhi)}
.pr:last-child{border:0}
.slot{border:0;padding:10px;border-radius:26px;background:var(--nb);box-shadow:10px 10px 22px var(--nlo),-10px -10px 22px var(--nhi)}
.slot img{border-radius:18px;background:var(--nb)}
.blk .cta{border:0;border-radius:40px;background:var(--nb);color:#fff;box-shadow:8px 8px 16px var(--nlo),-8px -8px 16px var(--nhi)}
.blk .cta:hover{background:var(--nb);color:#fff;box-shadow:inset 6px 6px 12px var(--nlo),inset -6px -6px 12px var(--nhi)}
.blk .cta.fill{background:#fff;color:#000}.blk .cta.fill:hover{background:#fff;color:#000}
#contact{padding:50px 36px;border-radius:36px;background:var(--nb);box-shadow:12px 12px 26px var(--nlo),-12px -12px 26px var(--nhi)}
footer{border-top:0;box-shadow:0 -1px 0 var(--nhi)}
.chat-b{border:0;border-radius:40px;background:var(--nb);box-shadow:8px 8px 16px var(--nlo),-8px -8px 16px var(--nhi)}
.chat-b:hover{background:var(--nb);color:#fff;box-shadow:inset 5px 5px 10px var(--nlo),inset -5px -5px 10px var(--nhi)}
.chat-p{border:0;border-radius:26px;background:var(--nb);box-shadow:12px 12px 26px var(--nlo),-12px -12px 26px var(--nhi);overflow:hidden}
.chat-h,.chat-f{border-color:rgba(255,255,255,.06)}
.cm{border:0;box-shadow:inset 4px 4px 8px var(--nlo),inset -4px -4px 8px var(--nhi)}
.cm.me{background:#fff;box-shadow:none}
/* intro video */
html.lock{overflow:hidden}
#intro{position:fixed;inset:0;z-index:100;background:#000;transition:opacity .8s ease}
#intro.out{opacity:0;pointer-events:none}
#intro video{width:100%;height:100%;object-fit:cover;display:block}
#skip{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));height:40px;padding:0 18px;border:0;border-radius:40px;background:rgba(255,255,255,.12);color:#fff;font:400 13px 'Poppins',sans-serif;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
</style></head>
<body>
<div id="intro" role="presentation"><video id="iv" src="intro.mp4" muted playsinline autoplay loop preload="auto" aria-hidden="true"></video><button id="skip" type="button">Skip</button></div>
<script>
(function(){
 var i=document.getElementById('intro'),v=document.getElementById('iv'),done=false,t0=Date.now(),timer;
 document.documentElement.classList.add('lock');
 function end(){if(done)return;done=true;clearTimeout(timer);i.classList.add('out');document.documentElement.classList.remove('lock');setTimeout(function(){if(i.parentNode)i.parentNode.removeChild(i)},900)}
 timer=setTimeout(end,3000);
 document.getElementById('skip').onclick=end;
 v.addEventListener('error',end);
 var p=v.play();if(p&&p.catch)p.catch(end);
 window.introCfg=function(d){var c=d&&d.intro;if(!c)return;if(String(c.enabled)==='0'){end();return}var s=Number(c.seconds);if(s>0){clearTimeout(timer);timer=setTimeout(end,Math.max(0,s*1000-(Date.now()-t0)))}};
})();
</script>
<section class="hero" id="hero">
<canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
<div class="ui">
<h1 class="sr-only" id="h1"></h1>
<header class="nav"><a href="#hero" class="logo"><span class="lm" id="lm"></span><b id="lb"></b><span id="ls"></span></a><ul class="nav-links" id="navl"></ul></header>
<div class="arrows">
<button class="arrow" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
<button class="arrow" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
<nav class="dots"><button class="dot" aria-label="Slide 1"></button><button class="dot active" aria-label="Slide 2"></button><button class="dot" aria-label="Slide 3"></button></nav>
<p class="tagline" id="tag"></p>
<div class="cta-row"><a href="#services" class="cta" id="cta"></a><span class="cta-line"></span><span class="count" id="cnt" aria-hidden="true"></span></div>
<div class="loader" id="loader">Loading model</div>
<div class="fb" id="fb"></div>
</div>
</section>

<div class="lower"><div class="wrap" id="rest"></div></div>

<div id="zoom"><img alt=""></div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(i){return document.getElementById(i)}
var MARK='<svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect x="2" y="2" width="17" height="17" rx="4" fill="#fff"/><rect x="21" y="2" width="17" height="17" rx="4" fill="none" stroke="#fff" stroke-width="2"/><rect x="2" y="21" width="17" height="17" rx="4" fill="none" stroke="#fff" stroke-width="2"/><rect x="21" y="21" width="17" height="17" rx="4" fill="#fff"/></svg>';
function render(d){
 var h=d.hero||{},lines=(h.lines||[]).filter(Boolean),b=String(d.brand||''),sp=b.indexOf(' '),bo,re;
 if(sp>0){bo=b.slice(0,sp);re=b.slice(sp+1)}else{var n=b.length>3?b.length-2:b.length;bo=b.slice(0,n);re=b.slice(n)}
 document.title=b+' — '+lines.join(' ');
 if(d.accent)document.documentElement.style.setProperty('--ac',d.accent);
 var mark=d.logo?'<img src="'+esc(d.logo)+'" alt="" style="height:36px;width:auto;display:block">':MARK;
 $('lm').innerHTML=mark;$('lb').textContent=bo;$('ls').textContent=re;$('ls').style.marginLeft=sp>0?'':'-8px';
 var fi=document.createElement('link');fi.rel='icon';fi.href=d.logo||('data:image/svg+xml,'+encodeURIComponent(MARK.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ').replace('width="34" height="34"','width="64" height="64"').replace(/fill="#fff"/g,'fill="#000"').replace(/stroke="#fff"/g,'stroke="#000"')));document.head.appendChild(fi);
 var hr=['#hero','#services','#contact'];
 $('navl').innerHTML=(d.nav||[]).map(function(n,i){return'<li><a href="'+hr[i]+'">'+esc(n)+'</a></li>'}).join('');
 $('h1').textContent=lines.join(' ');$('fb').innerHTML=lines.map(esc).join('<br>');
 $('tag').innerHTML=String(h.tagline||'').split('|').map(esc).join('<br>')+' <strong>'+esc(h.taglineBold)+'</strong>';
 var c=$('cta');c.textContent=h.cta||'';c.href=h.ctaLink||'#contact';$('cnt').textContent=h.count||'';
 var wa='https://wa.me/'+String(d.whatsapp).replace(/\D/g,''),ig='https://instagram.com/'+String(d.instagram).replace(/^@/,'');
 var w=(d.work||[]).filter(Boolean),slots='';w.forEach(function(u,i){slots+='<div class="slot"><img src="'+esc(u)+'" alt="Work sample '+(i+1)+'" onerror="this.parentNode.classList.add(\'bad\')"></div>'});if(!slots)slots='<p class="sub" style="margin:0">Work samples coming soon.</p>'
 $('rest').innerHTML=
 '<div class="stats">'+(d.stats||[]).map(function(s){return'<div class="stat"><b>'+esc(s[0])+'</b><small>'+esc(s[1])+'</small></div>'}).join('')+'</div>'+
 '<section class="blk" id="services"><p class="eyebrow">Services</p><h2>What we <b>create</b></h2>'+
 d.services.map(function(s,i){var min=Math.min.apply(null,s.rows.map(function(r){return Number(r[1])}));return'<div class="svc"><div class="num">'+('0'+(i+1)).slice(-2)+'</div><div class="st"><span class="ic">'+esc(s.icon)+'</span><h3>'+esc(s.title)+'</h3><p class="from">From ₹'+min+'</p></div><div class="rws">'+s.rows.map(function(r){return'<div class="pr"><span>'+esc(r[0])+'</span><b>₹'+esc(r[1])+'</b></div>'}).join('')+'</div></div>'}).join('')+'</section>'+
 '<section class="blk" id="work"><p class="eyebrow">Work</p><h2>Our <b>work</b></h2><div class="work">'+slots+'</div></section>'+
 '<section class="blk" id="contact"><p class="eyebrow">Contact</p><h2>Ready to <b>start</b>?</h2><p class="sub">Send us a message and get your quote within an hour.</p><div class="btns"><a class="cta fill" href="'+esc(wa)+'">WhatsApp us</a><a class="cta" href="'+esc(ig)+'">Instagram DM</a>'+(d.email?'<a class="cta" href="mailto:'+esc(d.email)+'">Email us</a>':'')+'</div></section>'+
 '<footer><span>© 2026 '+esc(b)+'. All rights reserved.</span><span>Photos · Websites · Logos</span></footer>';
}
window.siteReady=fetch('data.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){render(d);try{initChat(d)}catch(e){}try{introCfg(d)}catch(e){}return d});
document.addEventListener('click',function(e){var im=e.target.closest('.slot img'),z=$('zoom');if(im){z.querySelector('img').src=im.src;z.classList.add('on')}else if(z.classList.contains('on'))z.classList.remove('on')});
function initChat(d){
 var c=d.chat;if(!c||!(c.enabled==='1'||c.enabled===true)||!c.dbUrl)return;
 var db=String(c.dbUrl).replace(/\/+$/,''),vid,nm='';
 try{vid=localStorage.getItem('cvid');if(!vid){vid='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem('cvid',vid)}nm=localStorage.getItem('cname')||''}catch(e){vid='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
 var btn=document.createElement('button');btn.className='chat-b';btn.textContent='Chat with us';
 var p=document.createElement('div');p.className='chat-p';p.innerHTML='<div class="chat-h">Chat with us</div><div class="chat-m" id="cmsg"></div><div class="chat-f">'+(nm?'':'<input id="cn" placeholder="Your name" maxlength="40">')+'<input id="ct" placeholder="Type a message…" maxlength="400"><button id="cs" type="button">Send</button></div>';
 document.body.appendChild(btn);document.body.appendChild(p);
 var box=p.querySelector('#cmsg'),last='';
 function draw(o){var ms=Object.keys(o||{}).map(function(k){return o[k]}).sort(function(a,b){return a.t-b.t});var h=ms.length?ms.map(function(m){return'<div class="cm '+(m.from==='v'?'me':'')+'">'+esc(m.text)+'</div>'}).join(''):'<div class="cm">Hi! Send us a message and we will reply here.</div>';if(h!==last){box.innerHTML=h;box.scrollTop=box.scrollHeight;last=h}}
 function poll(){if(!p.classList.contains('open'))return;fetch(db+'/chats/'+vid+'.json').then(function(r){return r.json()}).then(draw).catch(function(){})}
 setInterval(poll,4000);
 btn.onclick=function(){p.classList.toggle('open');if(p.classList.contains('open'))poll()};
 function send(){var t=p.querySelector('#ct'),n=p.querySelector('#cn'),txt=t.value.trim();if(!txt)return;if(n){nm=n.value.trim()||'Visitor';try{localStorage.setItem('cname',nm)}catch(e){}n.remove();n=null}
  t.value='';fetch(db+'/chats/'+vid+'.json',{method:'POST',body:JSON.stringify({from:'v',name:nm||'Visitor',text:txt,t:Date.now()})}).then(poll).catch(function(){})}
 p.querySelector('#cs').onclick=send;p.querySelector('#ct').addEventListener('keydown',function(e){if(e.key==='Enter')send()});
}
window.siteReady.catch(function(){$('rest').innerHTML='<p style="text-align:center;color:#8a92a3">Could not load data.json. Open through GitHub Pages or a local server.</p>'});
setTimeout(function(){if(!window.__3d)document.body.classList.add('no3d')},8000);
document.querySelectorAll('.dot').forEach(function(d){d.addEventListener('click',function(){document.querySelectorAll('.dot').forEach(function(x){x.classList.remove('active')});d.classList.add('active')})});
</script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {mergeVertices,mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const D=await window.siteReady;
const MODEL_URL=D.modelUrl||'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';
const LINES=((D.hero&&D.hero.lines)||['Explore','New','Ideas']).filter(Boolean);
const hero=document.getElementById('hero'),canvas=document.getElementById('scene'),loader=document.getElementById('loader');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
window.__3d=true;
renderer.setClearColor(0x000000,1);renderer.outputColorSpace=THREE.SRGBColorSpace;
const camera=new THREE.PerspectiveCamera(30,1,.1,100);camera.position.set(0,0,10);camera.lookAt(0,0,0);
const scene=new THREE.Scene(),bgScene=new THREE.Scene(),bgCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const bgCanvas=document.createElement('canvas'),bgCtx=bgCanvas.getContext('2d');
const bgTex=new THREE.CanvasTexture(bgCanvas);bgTex.colorSpace=THREE.SRGBColorSpace;bgTex.minFilter=THREE.LinearFilter;bgTex.magFilter=THREE.LinearFilter;bgTex.generateMipmaps=false;
const bgMat=new THREE.ShaderMaterial({uniforms:{uTex:{value:bgTex}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',fragmentShader:'uniform sampler2D uTex;varying vec2 vUv;void main(){gl_FragColor=texture2D(uTex,vUv);\n#include <colorspace_fragment>\n}',depthTest:false,depthWrite:false});
const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgMat);quad.frustumCulled=false;bgScene.add(quad);

const rtOpts={type:THREE.HalfFloatType};
const rtBack=new THREE.WebGLRenderTarget(4,4,rtOpts),rtFront=new THREE.WebGLRenderTarget(4,4,rtOpts);

const vert='varying vec3 vNormal;varying vec3 vEye;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vec4 mv=viewMatrix*wp;gl_Position=projectionMatrix*mv;vNormal=normalize(normalMatrix*normal);vEye=normalize(mv.xyz);}';
const frag=`
uniform vec2 uResolution;uniform sampler2D uTexture;
uniform float uIorR,uIorY,uIorG,uIorC,uIorB,uIorP,uRefractPower,uChromatic,uSaturation,uShininess,uDiffuseness,uFresnelPower,uBackside;
uniform vec3 uLight;varying vec3 vNormal;varying vec3 vEye;
const int LOOP=16;
float spec(vec3 l,float sh,float df,vec3 n,vec3 eye){vec3 lv=normalize(-l);vec3 hv=normalize(lv+(-eye));return pow(max(dot(n,hv),0.0),sh)+max(0.0,dot(n,lv))*df;}
vec3 smp(float ior,float k,float slide,vec3 n,vec3 eye,vec2 uv){vec3 rf=refract(eye,n,1.0/ior);return texture2D(uTexture,uv+rf.xy*(uRefractPower+slide*k)*uChromatic).rgb;}
void main(){
 vec2 uv=gl_FragCoord.xy/uResolution;
 vec3 n=normalize(vNormal);if(uBackside>0.5)n=-n;
 vec3 eye=normalize(vEye);vec3 col=vec3(0.0);
 for(int i=0;i<LOOP;i++){
  float s=float(i)/float(LOOP)*0.045;
  float r=smp(uIorR,1.0,s,n,eye,uv).x*0.5;
  vec3 ty=smp(uIorY,1.0,s,n,eye,uv);float y=(ty.x*2.0+ty.y*2.0-ty.z)/6.0;
  float g=smp(uIorG,2.0,s,n,eye,uv).y*0.5;
  vec3 tc=smp(uIorC,2.5,s,n,eye,uv);float c=(tc.y*2.0+tc.z*2.0-tc.x)/6.0;
  float b=smp(uIorB,3.0,s,n,eye,uv).z*0.5;
  vec3 tp=smp(uIorP,1.0,s,n,eye,uv);float p=(tp.z*2.0+tp.x*2.0-tp.y)/6.0;
  col+=vec3(r+(2.0*p+2.0*y-c)/3.0,g+(2.0*y+2.0*c-p)/3.0,b+(2.0*c+2.0*p-y)/3.0);
 }
 col/=float(LOOP);
 float lum=dot(col,vec3(0.2125,0.7154,0.0721));col=mix(vec3(lum),col,uSaturation);
 float sp=spec(uLight,uShininess,uDiffuseness,n,eye)+0.6*spec(vec3(1.0,1.0,-1.0),uShininess*0.6,uDiffuseness*0.5,n,eye);
 col+=sp*(uBackside>0.5?0.35:1.0);
 float f=pow(max(0.0,1.0+dot(eye,n)),uFresnelPower);
 col=mix(col,vec3(1.0),f*(uBackside>0.5?0.25:0.55));
 col+=vec3(0.004,0.005,0.007);
 gl_FragColor=vec4(col,1.0);
 #include <colorspace_fragment>
}`;
function mkMat(back,tex){return new THREE.ShaderMaterial({vertexShader:vert,fragmentShader:frag,side:back?THREE.BackSide:THREE.FrontSide,uniforms:{
 uResolution:{value:new THREE.Vector2(1,1)},uTexture:{value:tex},uIorR:{value:1.15},uIorY:{value:1.16},uIorG:{value:1.18},uIorC:{value:1.22},uIorB:{value:1.22},uIorP:{value:1.22},
 uRefractPower:{value:back?.22:.30},uChromatic:{value:.5},uSaturation:{value:1.08},uShininess:{value:90},uDiffuseness:{value:.02},uFresnelPower:{value:5},uLight:{value:new THREE.Vector3(-1,1,1)},uBackside:{value:back?1:0}}})}
const backMat=mkMat(true,rtBack.texture),frontMat=mkMat(false,rtFront.texture);

const pivot=new THREE.Group(),spinner=new THREE.Group();spinner.rotation.set(-.42,.62,.18);pivot.add(spinner);
let cube=null;

function isMobile(W,H){return W<768||W/H<1}
function drawBG(){
 const W=hero.clientWidth,H=hero.clientHeight,dpr=renderer.getPixelRatio(),m=isMobile(W,H);
 bgCanvas.width=Math.round(W*dpr);bgCanvas.height=Math.round(H*dpr);
 bgCtx.setTransform(dpr,0,0,dpr,0,0);bgCtx.fillStyle='#000';bgCtx.fillRect(0,0,W,H);
 let fs=Math.min(H*.21,W*(m?.21:.118));
 bgCtx.font='800 '+fs+'px Poppins, sans-serif';
 let wide=0;LINES.forEach(function(t){wide=Math.max(wide,bgCtx.measureText(t).width)});
 const maxW=W*(m?.9:.5);if(wide>maxW){fs*=maxW/wide;bgCtx.font='800 '+fs+'px Poppins, sans-serif'}
 bgCtx.fillStyle='#e9e9e9';bgCtx.textAlign='center';bgCtx.textBaseline='alphabetic';
 const cx=W*(m?.5:.505),cy=H*(m?.45:.468),gap=fs*1.07,cap=fs*.7,n=LINES.length;
 LINES.forEach(function(t,i){bgCtx.fillText(t,cx,cy+cap/2+(i-(n-1)/2)*gap)});
 bgTex.needsUpdate=true;
}
const dbv=new THREE.Vector2();
function layout(){
 const W=hero.clientWidth,H=hero.clientHeight,m=isMobile(W,H);
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(W,H,false);
 camera.aspect=W/H;camera.updateProjectionMatrix();
 renderer.getDrawingBufferSize(dbv);rtBack.setSize(dbv.x,dbv.y);rtFront.setSize(dbv.x,dbv.y);
 backMat.uniforms.uResolution.value.copy(dbv);frontMat.uniforms.uResolution.value.copy(dbv);
 drawBG();
 const visH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*10,visW=visH*camera.aspect;
 const sx=m?.5:.517,sy=m?.45:.488;
 pivot.position.set((sx-.5)*visW,(.5-sy)*visH,0);
 const px=Math.min(H*.44,W*(m?.45:.29));pivot.scale.setScalar(px/H*visH);
}

function setGeometry(geo){
 geo.computeBoundingBox();const bb=geo.boundingBox,c=new THREE.Vector3();bb.getCenter(c);geo.translate(-c.x,-c.y,-c.z);
 const s=new THREE.Vector3();bb.getSize(s);geo.scale(1/Math.max(s.x,s.y,s.z),1/Math.max(s.x,s.y,s.z),1/Math.max(s.x,s.y,s.z));
 cube=new THREE.Mesh(geo,frontMat);spinner.add(cube);scene.add(pivot);loader.classList.add('done');
}
function fallback(){const g=new RoundedBoxGeometry(1,1,1,8,.12);g.deleteAttribute('uv');setGeometry(g)}
new GLTFLoader().load(MODEL_URL,function(gltf){
 try{
  const parts=[];gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse(function(o){if(o.isMesh){let g=o.geometry.clone();['uv','color','tangent'].forEach(function(a){if(g.getAttribute(a))g.deleteAttribute(a)});g=mergeVertices(g,1e-4);g.computeVertexNormals();g.applyMatrix4(o.matrixWorld);parts.push(g)}});
  if(!parts.length)throw 0;
  setGeometry(parts.length>1?mergeGeometries(parts):parts[0]);
 }catch(e){fallback()}
},undefined,fallback);

/* interaction */
const qa=new THREE.Quaternion(),AX=new THREE.Vector3(1,0,0),AY=new THREE.Vector3(0,1,0);
function rot(dx,dy){spinner.quaternion.premultiply(qa.setFromAxisAngle(AY,dx));spinner.quaternion.premultiply(qa.setFromAxisAngle(AX,dy))}
let dragging=false,lx=0,ly=0,lt=0,vx=0,vy=0,released=-1e9,spinRem=0;
canvas.addEventListener('pointerdown',function(e){dragging=true;lx=e.clientX;ly=e.clientY;lt=performance.now();vx=vy=0;spinRem=0;canvas.classList.add('dragging');try{canvas.setPointerCapture(e.pointerId)}catch(x){}});
canvas.addEventListener('pointermove',function(e){if(!dragging)return;const now=performance.now(),f=Math.max(1,now-lt)/16.67,dx=(e.clientX-lx)*.008,dy=(e.clientY-ly)*.008;rot(dx,dy);vx=dx/f;vy=dy/f;lx=e.clientX;ly=e.clientY;lt=now});
function up(){if(!dragging)return;dragging=false;released=performance.now();canvas.classList.remove('dragging')}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
document.getElementById('prev').addEventListener('click',function(){vx=vy=0;spinRem=-Math.PI/2});
document.getElementById('next').addEventListener('click',function(){vx=vy=0;spinRem=Math.PI/2});

let visible=true;new IntersectionObserver(function(e){visible=e[0].isIntersecting}).observe(hero);
let prev=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-prev)/1000);prev=now;if(!visible)return;
 if(!dragging){
  rot(vx*dt*60,vy*dt*60);const k=Math.pow(.94,dt*60);vx*=k;vy*=k;
  const idle=now-released-600,bl=Math.max(0,Math.min(1,idle/1000));
  if(bl>0)rot(.0035*bl*dt*60,.0012*bl*dt*60);
  if(spinRem!==0){const st=spinRem*Math.min(1,.09*dt*60);rot(st,0);spinRem-=st;if(Math.abs(spinRem)<.0005)spinRem=0}
 }
 renderer.autoClear=true;
 renderer.setRenderTarget(rtBack);renderer.render(bgScene,bgCam);
 renderer.setRenderTarget(rtFront);renderer.render(bgScene,bgCam);
 if(cube){renderer.autoClear=false;cube.material=backMat;renderer.render(scene,camera)}
 renderer.setRenderTarget(null);renderer.autoClear=true;renderer.render(bgScene,bgCam);
 if(cube){renderer.autoClear=false;renderer.clearDepth();cube.material=frontMat;renderer.render(scene,camera);renderer.autoClear=true}
}
window.addEventListener('resize',layout);
if(document.fonts)document.fonts.addEventListener('loadingdone',drawBG);
Promise.race([Promise.all([document.fonts.load('800 100px Poppins'),document.fonts.ready]),new Promise(function(r){setTimeout(r,2500)})]).then(function(){layout();requestAnimationFrame(frame)});
</script>
